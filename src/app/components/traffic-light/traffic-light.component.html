<div class="traffic-light">
  <div class="light green" [@lightAnimation]="activeLight === 'green' ? 'active' : 'inactive'"></div>
  <div class="light yellow" [@lightAnimation]="activeLight === 'yellow' ? 'active' : 'inactive'"></div>
  <div class="light red" [@lightAnimation]="activeLight === 'red' ? 'active' : 'inactive'"></div>
</div>
